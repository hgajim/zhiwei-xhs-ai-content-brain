services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: brand_kb
      POSTGRES_USER: brand_kb
      POSTGRES_PASSWORD: change_me
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brand_kb -d brand_kb"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
